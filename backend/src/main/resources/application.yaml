spring:
  application:
    name: portabilidade-convenios

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/portabilidade}
    username: ${SPRING_DATASOURCE_USERNAME:portabilidade}
    password: ${SPRING_DATASOURCE_PASSWORD:portabilidade}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    
central:
  convenios:
    url: ${CENTRAL_CONVENIOS_URL:http://localhost:8081}
    
  integracao:
        chave-hmac: ${CENTRAL_HMAC_SECRET:chave_para_teste}
