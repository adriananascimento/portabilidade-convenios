services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: portabilidade
      POSTGRES_USER: portabilidade
      POSTGRES_PASSWORD: portabilidade
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portabilidade -d portabilidade"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dados_postgres: