name: central-convenios

services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: central_convenios
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dados_postgres_central:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central_convenios"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  central:
    build:
      context: ./central-convenios
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/central_convenios
      SPRING_DATASOURCE_USERNAME: central
      SPRING_DATASOURCE_PASSWORD: central
      CENTRAL_HMAC_SECRET: ${CENTRAL_HMAC_SECRET:-chave_para_teste}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dados_postgres_central:
