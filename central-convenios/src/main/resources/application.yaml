server:
  port: 8081

spring:
  application:
    name: central-convenios

  datasource:
    url: jdbc:postgresql://localhost:5434/central_convenios
    username: central
    password: central
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration