name: portal-portabilidade

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: portabilidade
      POSTGRES_USER: portabilidade
      POSTGRES_PASSWORD: portabilidade
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados_postgres_portal:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portabilidade -d portabilidade"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portabilidade
      SPRING_DATASOURCE_USERNAME: portabilidade
      SPRING_DATASOURCE_PASSWORD: portabilidade
      CENTRAL_CONVENIOS_URL: http://host.docker.internal:8081
      CENTRAL_HMAC_SECRET: ${CENTRAL_HMAC_SECRET:-chave_para_teste}
    depends_on:
      postgres:
        condition: service_healthy
        
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  dados_postgres_portal:
